name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Check installer syntax
        run: sh -n install.sh
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - run: target/release/utterpipe-pocket-tts info

  platform:
    name: ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
          - name: macOS x64
            runner: macos-15-intel
          - name: Windows x64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Unix installer syntax
        if: runner.os != 'Windows'
        run: sh -n install.sh
      - name: Check Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors -join [Environment]::NewLine) }
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - name: Smoke-test standalone diagnostics
        shell: bash
        run: |
          suffix=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then suffix=".exe"; fi
          "target/release/utterpipe-pocket-tts$suffix" info
