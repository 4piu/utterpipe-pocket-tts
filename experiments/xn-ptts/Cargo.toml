[package]
name = "utterpipe-pocket-xn-eval"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
ptts = { git = "https://github.com/4piu/xn-ptts", rev = "4dbd8d6832cf4e093d08a1bd4666a08783345e7b", features = ["sp"] }
rand = "0.9"
rand_distr = "0.5"
sentencepiece = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
xn = "=0.1.21"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.clippy]
all = "warn"
