[package]
name = "utterpipe-pocket-tts"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Offline Pocket TTS provider for UtterPipe"
repository = "https://github.com/4piu/utterpipe-pocket-tts"
homepage = "https://github.com/4piu/utterpipe-pocket-tts"

[dependencies]
atomicwrites = "0.4"
bzip2 = "0.6"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
futures-util = "0.3"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
sherpa-onnx = { version = "=1.13.4", default-features = false, features = ["static"] }
tar = "0.4"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
url = "2.5"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
