[package]
name = "utterpipe-pocket-tts"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Offline neural text-to-speech (TTS) provider for UtterPipe, powered by Pocket TTS and XN"
repository = "https://github.com/4piu/utterpipe-pocket-tts"
homepage = "https://github.com/4piu/utterpipe-pocket-tts"

[dependencies]
atomicwrites = "0.4"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
futures-util = "0.3"
libc = "0.2"
ptts = { git = "https://github.com/4piu/xn-ptts", rev = "4dbd8d6832cf4e093d08a1bd4666a08783345e7b", features = ["sp"] }
rand = "0.9"
rand_distr = "0.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "system-proxy"] }
rubato = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
sentencepiece = "0.13.2"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
url = "2.5"
xn = "=0.1.21"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
